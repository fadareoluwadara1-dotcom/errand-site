<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin</title>
<style>
:root{--navy:#0b1f4b;--gold:#f59e0b;--gold2:#d97706;--grey:#f3f4f6;--red:#b91c1c;--green:#15803d;--muted:#6b7280}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--grey);color:#1f2937;line-height:1.45}
header{background:var(--navy);color:#fff;display:flex;justify-content:space-between;align-items:center;padding:10px 14px;position:sticky;top:0;z-index:5}
#tabs{display:flex;gap:6px;overflow-x:auto;background:#fff;padding:8px;position:sticky;top:48px;z-index:4;box-shadow:0 1px 4px rgba(0,0,0,.1)}
#tabs button{flex:none;border:0;background:var(--grey);padding:8px 12px;border-radius:99px;font:inherit;font-weight:600;cursor:pointer}
#tabs button.on{background:var(--navy);color:#fff}
main{max-width:760px;margin:0 auto;padding:12px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 6px rgba(11,31,75,.08)}
.tap{cursor:pointer}
h3{color:var(--navy);margin-bottom:8px;font-size:1.05rem}
label{display:block;font-weight:600;font-size:.88rem;margin-bottom:8px}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1.5px solid #cbd5e1;border-radius:8px;margin-top:3px;background:#fff}
textarea{min-height:80px}
.chk{display:flex;gap:8px;align-items:center}.chk input{width:auto;margin:0}
.b,.b2,.bg,.br{border:0;cursor:pointer;font:inherit;font-weight:700;padding:11px 16px;border-radius:99px;background:var(--gold);color:var(--navy);width:100%}
.b2{background:var(--navy);color:#fff;width:auto;margin-bottom:10px}
.bg{background:var(--green);color:#fff}.br{background:#fee2e2;color:var(--red)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pill{display:inline-block;background:var(--navy);color:#fff;border-radius:99px;padding:2px 10px;font-size:.78rem;font-weight:700;vertical-align:middle}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid #eef0f3;font-size:.92rem}
.kv span{color:var(--muted)}.kv b{text-align:right;word-break:break-word}
small{color:var(--muted)}
a{color:var(--navy);font-weight:600}
#login{max-width:380px;margin:12vh auto;padding:0 14px}
.msg{color:var(--red);font-weight:600;margin:8px 0}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--green);color:#fff;padding:10px 18px;border-radius:99px;font-weight:600;z-index:9;display:none;max-width:90vw}
#toast.bad{background:var(--red)}
</style>
</head>
<body>
<div id="login">
  <div class="card">
    <h3>Admin sign in</h3>
    <form id="lf">
      <label>Email<input id="em" type="email" autocomplete="username" required></label>
      <label>Password<input id="pw" type="password" autocomplete="current-password" required></label>
      <div class="msg" id="lm"></div>
      <button class="b">Sign in</button>
    </form>
  </div>
</div>

<div id="app" hidden>
  <header><b id="hn">Admin</b><button class="b2" style="margin:0;background:var(--gold);color:var(--navy)" onclick="out()">Sign out</button></header>
  <nav id="tabs"></nav>
  <main id="main"></main>
</div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cfg=window.APP_CONFIG||{};
const sb=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);
const N=n=>'₦'+Number(n||0).toLocaleString('en-NG');
const D=d=>d?new Date(d).toLocaleString('en-NG',{day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}):'';
const wa=n=>{let d=String(n||'').replace(/\D/g,'');if(d.startsWith('0'))d='234'+d.slice(1);return d};
const ST=['Pending','Reviewed','Awaiting Payment','Paid','Assigned','Processing','Ready for Delivery','Delivered','Completed','Cancelled','Disputed'];
const opts=(a,s)=>a.map(x=>`<option${x===s?' selected':''}>${esc(x)}</option>`).join('');
const fd=e=>{e.preventDefault();return Object.fromEntries(new FormData(e.target))};
const num=v=>v===''||v==null?null:Number(v);
const F=(n,l,v,t='text',x='')=>`<label>${l}<input name="${n}" type="${t}" value="${esc(v)}" ${x}></label>`;
const NF=(n,l,v)=>F(n,l,v,'number','step="any" min="0"');
const TA=(n,l,v)=>`<label>${l}<textarea name="${n}">${esc(v)}</textarea></label>`;
const S=(n,l,a,v)=>`<label>${l}<select name="${n}">${opts(a,v)}</select></label>`;
const kv=(k,v)=>`<div class="kv"><span>${k}</span><b>${esc(v??'-')}</b></div>`;
const fail=e=>{$('main').innerHTML='<p class="msg">'+esc(e.message)+'</p>'};

let tt;
function toast(m,bad){const t=$('toast');t.textContent=m;t.className=bad?'bad':'';t.style.display='block';clearTimeout(tt);tt=setTimeout(()=>t.style.display='none',3500)}
async function run(p,ok){const r=await p;if(r.error){toast(r.error.message,1);return null}if(ok)toast(ok);return r.data||true}

// ---------- auth ----------
$('lf').onsubmit=async e=>{
  e.preventDefault();$('lm').textContent='';
  const {error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});
  if(error)return $('lm').textContent=error.message;
  boot();
};
async function out(){await sb.auth.signOut();location.reload()}
async function boot(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return;
  const {data:p}=await sb.from('profiles').select('role,is_active').eq('id',session.user.id).maybeSingle();
  if(!p||p.role!=='admin'||!p.is_active){await sb.auth.signOut();$('lm').textContent='This account is not an administrator.';return}
  $('login').hidden=true;$('app').hidden=false;
  const st=await sb.from('site_settings').select('business_name').eq('id',1).maybeSingle();
  if(st.data)$('hn').textContent=st.data.business_name+' · Admin';
  go('orders');
}

// ---------- tabs ----------
const TABS={orders:'Orders',people:'Delivery',pricing:'Pricing',commissions:'Commissions',reviews:'Reviews',complaints:'Complaints',services:'Services',settings:'Site',logs:'Logs'};
$('tabs').innerHTML=Object.entries(TABS).map(([k,v])=>`<button data-t="${k}" onclick="go('${k}')">${v}</button>`).join('');
let cur='orders';
async function go(t){
  cur=t||cur;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===cur));
  $('main').innerHTML='<p>Loading…</p>';
  await T[cur]();scrollTo(0,0);
}
const T={};

// ---------- orders ----------
let OF='';
T.orders=async()=>{
  let q=sb.from('orders').select('id,order_reference,customer_name,service_category,status,total_amount,created_at').order('created_at',{ascending:false}).limit(100);
  if(OF)q=q.eq('status',OF);
  const {data,error}=await q;if(error)return fail(error);
  $('main').innerHTML=`<div class="card"><select onchange="OF=this.value;go('orders')"><option value="">All statuses</option>${opts(ST,OF)}</select></div>`+
  (data.map(o=>`<div class="card tap" onclick="order('${o.id}')"><b>${esc(o.order_reference)}</b> <span class="pill">${esc(o.status)}</span><div>${esc(o.customer_name)} · ${esc(o.service_category)}</div><small>${D(o.created_at)}${o.total_amount!=null?' · '+N(o.total_amount):''}</small></div>`).join('')||'<p>No orders.</p>');
};

async function order(id){
  $('main').innerHTML='<p>Loading…</p>';
  const [o,p,d]=await Promise.all([
    sb.from('orders').select('*').eq('id',id).single(),
    sb.from('payments').select('*').eq('order_id',id).order('created_at',{ascending:false}).limit(1),
    sb.from('delivery_personnel').select('id,full_name,availability_status').eq('is_active',true).order('full_name')
  ]);
  if(o.error)return fail(o.error);
  const x=o.data,pay=(p.data||[])[0],people=d.data||[];
  const files=[...(x.attachment_path||[]),...(x.reference_image_path?[x.reference_image_path]:[])];
  const locked=!!x.customer_approved_at;
  const dpName=(people.find(z=>z.id===x.assigned_delivery_person)||{}).full_name;
  $('main').innerHTML=`<button class="b2" onclick="go('orders')">← Orders</button>
  <div class="card"><h3>${esc(x.order_reference)} <span class="pill">${esc(x.status)}</span></h3>
    ${kv('Customer',x.customer_name)}${kv('Phone',x.phone_number)}${kv('WhatsApp',x.whatsapp_number)}
    ${kv('Department / level',[x.department,x.level].filter(Boolean).join(' · ')||'-')}
    ${kv('Service',x.service_category)}${kv('Request',x.request_description)}${kv('Quantity',x.quantity)}
    ${kv('Method',x.fulfilment_method)}${kv('Faculty / building',x.faculty_or_building)}${kv('Landmark',x.landmark)}
    ${kv('Collection point',x.collection_point)}${kv('Deliver to',x.delivery_location)}${kv('Placed',D(x.created_at))}
    <div style="margin-top:10px"><b>Files:</b> <span id="fl">${files.length?'':'none'}</span></div>
    <p style="margin-top:10px"><a href="https://wa.me/${wa(x.whatsapp_number)}" target="_blank" rel="noopener">WhatsApp customer</a> · <a href="tel:${esc(x.phone_number)}">Call</a></p>
  </div>

  <form class="card" onsubmit="saveOrder(event,'${id}')"><h3>Status and notes</h3>
    ${S('status','Status',ST,x.status)}${F('cancelled_reason','Cancel reason (if cancelled)',x.cancelled_reason)}${TA('admin_notes','Admin notes',x.admin_notes)}
    <button class="b">Save</button></form>

  <form class="card" onsubmit="quote(event,'${id}')"><h3>Quotation</h3>
    ${x.confirmed_product_cost!=null?kv('Product cost',N(x.confirmed_product_cost))+kv('Service fee',N(x.service_fee))+kv('Delivery',N(x.delivery_cost))+kv('Total',N(x.total_amount))+kv('Quote status',x.quote_status)+kv('Your earning',N(x.admin_earning))+kv('Delivery earning',N(x.delivery_earning)):'<small>No quote yet.</small>'}
    ${locked?'<p class="msg">Student approved this quote. Price is locked.</p>':`<div style="margin-top:10px">${NF('pc','Product / service cost (₦)',x.confirmed_product_cost)}${NF('dc','Delivery cost (₦)',x.delivery_cost)}<button class="b">Confirm and send quote</button></div>`}
  </form>

  <form class="card" onsubmit="assign(event,'${id}')"><h3>Delivery person</h3>
    ${kv('Assigned',dpName||'Nobody yet')}
    <label>Assign to<select name="dp"><option value="">Choose…</option>${people.map(z=>`<option value="${z.id}">${esc(z.full_name)} (${esc(z.availability_status)})</option>`).join('')}</select></label>
    <button class="b">Assign</button></form>

  ${x.total_amount!=null?`<form class="card" onsubmit="pay(event,'${id}',${x.total_amount},'${pay?pay.id:''}')"><h3>Payment</h3>
    ${kv('Expected',N(pay?pay.amount_expected:x.total_amount))}
    ${NF('ar','Amount received (₦)',pay?pay.amount_received:'')}
    ${S('ps','Payment status',['Awaiting Payment','Paid','Partially Paid','Refunded','Disputed'],pay?pay.payment_status:'Awaiting Payment')}
    ${F('pr','Payment reference',pay?pay.payment_reference:'')}
    <button class="b">Save payment</button></form>`:''}`;
  files.forEach(async(f,i)=>{
    const {data}=await sb.storage.from('order-uploads').createSignedUrl(f,600);
    if(data)$('fl').insertAdjacentHTML('beforeend',`<a href="${esc(data.signedUrl)}" target="_blank" rel="noopener">File ${i+1}</a> `);
  });
}
async function saveOrder(e,id){const f=fd(e);if(await run(sb.from('orders').update({status:f.status,admin_notes:f.admin_notes||null,cancelled_reason:f.cancelled_reason||null}).eq('id',id),'Saved'))order(id)}
async function quote(e,id){const f=fd(e);if(f.pc==null||f.pc==='')return toast('Enter the product cost',1);if(await run(sb.rpc('confirm_order_quote',{p_order_id:id,p_product_cost:num(f.pc),p_delivery_cost:num(f.dc)||0}),'Quote sent to student'))order(id)}
async function assign(e,id){const f=fd(e);if(!f.dp)return toast('Choose a delivery person',1);if(await run(sb.rpc('assign_delivery_person',{p_order_id:id,p_dp_id:f.dp}),'Assigned'))order(id)}
async function pay(e,id,exp,pid){
  const f=fd(e);
  const row={amount_received:num(f.ar)||0,payment_status:f.ps,payment_reference:f.pr||null,payment_date:new Date().toISOString().slice(0,10)};
  const q=pid?sb.from('payments').update(row).eq('id',pid):sb.from('payments').insert({...row,order_id:id,amount_expected:exp});
  if(await run(q,'Payment saved'))order(id);
}

// ---------- delivery people ----------
const pf=p=>`<form class="card" onsubmit="savePerson(event,'${p?p.id:''}')">${p?`<h3>${esc(p.full_name)}</h3><small>Assigned ${p.total_assigned} · Completed ${p.completed_orders} · Earned ${N(p.total_earnings)}</small>`:'<h3>Add delivery person</h3>'}
  ${F('full_name','Full name',p?.full_name,'text','required')}${F('phone_number','Phone',p?.phone_number,'tel','required')}${F('whatsapp_number','WhatsApp (optional)',p?.whatsapp_number,'tel')}
  ${S('availability_status','Availability',['Available','Busy','Offline'],p?.availability_status)}
  <label class="chk"><input type="checkbox" name="is_active"${!p||p.is_active?' checked':''}> Active</label>
  <button class="b">${p?'Save':'Add person'}</button></form>`;
T.people=async()=>{
  const [a,b]=await Promise.all([sb.from('delivery_personnel').select('*').order('full_name'),sb.from('delivery_personnel_stats').select('*')]);
  if(a.error)return fail(a.error);
  const st=Object.fromEntries((b.data||[]).map(s=>[s.id,s]));
  $('main').innerHTML=pf(null)+a.data.map(p=>pf({...p,total_assigned:0,completed_orders:0,total_earnings:0,...st[p.id],...p})).join('');
};
async function savePerson(e,id){
  const f=fd(e);
  const row={full_name:f.full_name,phone_number:f.phone_number,whatsapp_number:f.whatsapp_number||null,availability_status:f.availability_status,is_active:!!f.is_active};
  if(await run(id?sb.from('delivery_personnel').update(row).eq('id',id):sb.from('delivery_personnel').insert(row),'Saved'))go();
}

// ---------- pricing ----------
T.pricing=async()=>{
  const {data:s,error}=await sb.from('commission_settings').select('*').eq('is_active',true).maybeSingle();
  if(error)return fail(error);
  $('main').innerHTML=`<form class="card" onsubmit="savePricing(event)"><h3>Pricing and commission</h3>
    ${s&&s.admin_share_percent==null?'<p class="msg">Set the sharing percentages. Quotes cannot be sent until you do.</p>':''}
    ${NF('p','Service fee (% of product cost)',s?.commission_percent)}${NF('m','Minimum service fee (₦)',s?.minimum_fee)}
    ${NF('a','Your share of the fee (%)',s?.admin_share_percent)}${NF('d','Delivery person share (%)',s?.delivery_share_percent)}
    <small>The two shares must add up to 100. Changes apply only to new quotes.</small>
    <button class="b" style="margin-top:10px">Save settings</button></form>`;
};
async function savePricing(e){const f=fd(e);if(await run(sb.rpc('save_commission_settings',{p_percent:num(f.p),p_min_fee:num(f.m),p_admin_share:num(f.a),p_delivery_share:num(f.d)}),'Saved'))go()}

// ---------- commissions ----------
T.commissions=async()=>{
  const {data,error}=await sb.from('commission_transactions').select('*,orders(order_reference),delivery_personnel(full_name)').order('created_at',{ascending:false}).limit(100);
  if(error)return fail(error);
  const owed=data.reduce((t,c)=>t+Number(c.outstanding_balance),0);
  $('main').innerHTML=`<div class="card"><h3>Outstanding to you: ${N(owed)}</h3></div>`+
  (data.map(c=>`<form class="card" onsubmit="remit(event,'${c.id}')"><b>${esc(c.orders?.order_reference)}</b> <span class="pill">${esc(c.remittance_status)}</span>
    ${kv('Delivery person',c.delivery_personnel?.full_name)}${kv('Service fee',N(c.service_fee))}${kv('Owed to you',N(c.admin_amount))}${kv('Outstanding',N(c.outstanding_balance))}
    <div style="margin-top:8px">${NF('amt','Total remitted so far (₦)',c.amount_remitted)}${F('ref','Reference',c.remittance_reference)}</div>
    <button class="b">Record remittance</button></form>`).join('')||'<p>No commissions yet. They appear when orders are marked Completed.</p>');
};
async function remit(e,id){const f=fd(e);if(await run(sb.from('commission_transactions').update({amount_remitted:num(f.amt)||0,remittance_reference:f.ref||null}).eq('id',id),'Recorded'))go()}

// ---------- reviews ----------
T.reviews=async()=>{
  const {data,error}=await sb.from('reviews').select('*').order('created_at',{ascending:false}).limit(100);
  if(error)return fail(error);
  $('main').innerHTML=data.map(r=>`<div class="card"><b>${esc(r.customer_name)}</b> <span class="pill">${esc(r.status)}</span><div>${'★'.repeat(r.rating)}${'☆'.repeat(5-r.rating)}</div><p>${esc(r.comment)}</p>
    <div class="row"><button class="bg" onclick="rev('${r.id}','Approved')">Approve</button><button class="br" onclick="rev('${r.id}','Rejected')">Reject</button></div></div>`).join('')||'<p>No reviews yet.</p>';
};
async function rev(id,s){if(await run(sb.from('reviews').update({status:s}).eq('id',id),s))go()}

// ---------- complaints ----------
const CS=['Open','Investigating','Resolved','Rejected'];
T.complaints=async()=>{
  const {data,error}=await sb.from('complaints').select('*,orders(order_reference)').order('created_at',{ascending:false}).limit(100);
  if(error)return fail(error);
  $('main').innerHTML=data.map(c=>`<form class="card" onsubmit="cmp(event,'${c.id}')"><b>${esc(c.orders?.order_reference)}</b> <span class="pill">${esc(c.status)}</span>
    <p>${esc(c.description)}</p><small>${esc(c.customer_name)} · ${esc(c.contact)} · ${D(c.created_at)}</small>
    <div style="margin-top:8px">${S('status','Status',CS,c.status)}${TA('investigation_notes','Investigation notes',c.investigation_notes)}${TA('resolution_notes','Resolution notes',c.resolution_notes)}${NF('refund_amount','Refund (₦)',c.refund_amount)}</div>
    <button class="b">Save</button></form>`).join('')||'<p>No complaints.</p>';
};
async function cmp(e,id){const f=fd(e);if(await run(sb.from('complaints').update({status:f.status,investigation_notes:f.investigation_notes||null,resolution_notes:f.resolution_notes||null,refund_amount:num(f.refund_amount)||0}).eq('id',id),'Saved'))go()}

// ---------- services ----------
const sf=s=>`<form class="card" onsubmit="saveSvc(event,'${s?s.id:''}')"><h3>${s?esc(s.name):'Add service'}</h3>
  ${F('name','Name',s?.name,'text','required minlength="2"')}${TA('description','Description',s?.description)}
  <div class="row">${F('icon','Icon (emoji)',s?.icon)}${F('sort_order','Sort order',s?s.sort_order:0,'number')}</div>
  <label class="chk"><input type="checkbox" name="is_active"${!s||s.is_active?' checked':''}> Visible to students</label>
  <button class="b">${s?'Save':'Add service'}</button></form>`;
T.services=async()=>{
  const {data,error}=await sb.from('services').select('*').order('sort_order');
  if(error)return fail(error);
  $('main').innerHTML=sf(null)+data.map(sf).join('');
};
async function saveSvc(e,id){
  const f=fd(e);
  const row={name:f.name,description:f.description||null,icon:f.icon||null,sort_order:parseInt(f.sort_order,10)||0,is_active:!!f.is_active};
  if(await run(id?sb.from('services').update(row).eq('id',id):sb.from('services').insert(row),'Saved'))go();
}

// ---------- site settings ----------
T.settings=async()=>{
  const {data:s,error}=await sb.from('site_settings').select('*').eq('id',1).maybeSingle();
  if(error)return fail(error);
  $('main').innerHTML=`<form class="card" onsubmit="saveSite(event)"><h3>Website settings</h3>
    ${F('business_name','Business name',s?.business_name)}${F('announcement','Announcement banner (blank = hidden)',s?.announcement)}
    ${F('hero_headline','Home headline',s?.hero_headline)}${TA('hero_subtext','Home subtext',s?.hero_subtext)}
    ${F('whatsapp_number','WhatsApp number (e.g. 2348012345678)',s?.whatsapp_number,'tel')}${F('phone_number','Phone number',s?.phone_number,'tel')}
    ${F('contact_email','Contact email',s?.contact_email,'email')}${F('contact_address','Address',s?.contact_address)}
    ${TA('privacy_policy','Privacy policy',s?.privacy_policy)}${TA('terms_conditions','Terms and conditions',s?.terms_conditions)}
    <button class="b">Save</button></form>`;
};
async function saveSite(e){
  const f=fd(e);
  for(const k in f)if(f[k]==='')f[k]=null;
  ['business_name','hero_headline','hero_subtext'].forEach(k=>{if(f[k]===null)delete f[k]});
  await run(sb.from('site_settings').update(f).eq('id',1),'Saved');
}

// ---------- activity log ----------
T.logs=async()=>{
  const {data,error}=await sb.from('activity_logs').select('action,actor_email,created_at').order('created_at',{ascending:false}).limit(100);
  if(error)return fail(error);
  $('main').innerHTML=`<div class="card">${data.map(l=>`<div class="kv"><span>${D(l.created_at)}</span><b>${esc(l.action)}${l.actor_email?' · '+esc(l.actor_email):''}</b></div>`).join('')||'No activity yet.'}</div>`;
};

boot();
</script>
</body>
</html>
