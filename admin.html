
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin | Campus Errand Service</title>
<style>
:root{--navy:#0b1f4b;--navy2:#13307a;--gold:#f59e0b;--gold2:#d97706;--grey:#f3f4f6;--text:#1f2937;--muted:#6b7280;--red:#b91c1c;--green:#15803d;--radius:12px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--text);background:var(--grey);line-height:1.5;font-size:15px}
a{color:var(--navy2)}
h1,h2,h3{color:var(--navy);line-height:1.25}
h2{font-size:1.25rem;margin-bottom:12px}
h3{font-size:1.02rem;margin:14px 0 8px}
.wrap{max-width:1200px;margin:0 auto;padding:0 14px}
header{background:var(--navy);color:#fff;position:sticky;top:0;z-index:20}
.top{display:flex;justify-content:space-between;align-items:center;height:56px;gap:10px}
.top b{font-size:1.05rem}
.top button{background:transparent;border:1.5px solid #fff;color:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;font:inherit}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
.tabs button{flex:0 0 auto;background:rgba(255,255,255,.1);color:#fff;border:0;border-radius:999px;padding:8px 14px;cursor:pointer;font:inherit;font-weight:600}
.tabs button.on{background:var(--gold);color:var(--navy)}
main{padding:18px 0 60px}
.card{background:#fff;border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(11,31,75,.07)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{background:#fff;border-radius:var(--radius);padding:14px;box-shadow:0 2px 8px rgba(11,31,75,.07);cursor:pointer}
.stat b{display:block;font-size:1.6rem;color:var(--navy)}
.stat span{color:var(--muted);font-size:.85rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.bar input,.bar select{flex:1 1 160px}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1.5px solid #cbd5e1;border-radius:10px;background:#fff;color:var(--text)}
input:focus,select:focus,textarea:focus{outline:3px solid rgba(245,158,11,.4);border-color:var(--gold2)}
textarea{min-height:80px;resize:vertical}
input[type=checkbox]{width:auto}
label{display:block;font-weight:600;font-size:.88rem;margin-bottom:3px}
.f{margin-bottom:10px}
.two{display:grid;gap:10px;grid-template-columns:1fr 1fr}
.btn{border:0;cursor:pointer;font:inherit;font-weight:700;padding:10px 16px;border-radius:999px;background:var(--gold);color:var(--navy)}
.btn:hover{background:var(--gold2);color:#fff}
.btn.sec{background:var(--navy);color:#fff}
.btn.red{background:#fee2e2;color:var(--red)}
.btn.sm{padding:5px 12px;font-size:.85rem}
.btn:disabled{opacity:.6;cursor:not-allowed}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem;min-width:640px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid #eef0f3;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:.8rem;text-transform:uppercase}
tr.click{cursor:pointer}tr.click:hover{background:#fffbeb}
.pill{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--navy);color:#fff;font-size:.78rem;font-weight:700;white-space:nowrap}
.pill.g{background:var(--green)}.pill.r{background:var(--red)}.pill.y{background:var(--gold2)}.pill.m{background:#6b7280}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #eef0f3}
.kv span:first-child{color:var(--muted)}.kv span:last-child{text-align:right;font-weight:600;word-break:break-word}
.muted{color:var(--muted);font-size:.85rem}
.empty{text-align:center;color:var(--muted);padding:16px}
.tl{list-style:none;border-left:3px solid var(--gold);margin-left:6px;padding-left:14px}
.tl li{padding-bottom:8px}.tl small{display:block;color:var(--muted)}
.thumb{height:70px;width:70px;object-fit:cover;border-radius:8px;background:var(--grey)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
dialog{max-width:760px;width:94vw;border:0;border-radius:14px;padding:0;max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.5)}
.dh{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;background:var(--navy);color:#fff;position:sticky;top:0;z-index:2}
.dh h2{color:#fff;margin:0;font-size:1.1rem}
.dh button{background:none;border:0;color:#fff;font-size:1.6rem;cursor:pointer;line-height:1}
.db{padding:16px 18px 22px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:10px;z-index:100;display:none;max-width:92vw;font-weight:600}
#toast.bad{background:var(--red)}
#login{max-width:380px;margin:12vh auto 0;padding:0 14px}
#login .card{padding:22px}
#loginMsg{color:var(--red);font-weight:600;margin-bottom:10px;min-height:20px}
@media(max-width:560px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>

<div id="login" hidden>
  <div class="card">
    <h2>Administrator login</h2>
    <p class="muted" style="margin-bottom:12px">Campus Errand Service</p>
    <div id="loginMsg" role="alert"></div>
    <form id="loginForm">
      <div class="f"><label for="lEmail">Email</label><input id="lEmail" type="email" autocomplete="username" required></div>
      <div class="f"><label for="lPass">Password</label><input id="lPass" type="password" autocomplete="current-password" required></div>
      <button class="btn" style="width:100%" id="lBtn" type="submit">Sign in</button>
    </form>
  </div>
</div>

<div id="app" hidden>
  <header>
    <div class="wrap">
      <div class="top"><b>Admin Panel</b><div><span id="who" class="muted" style="color:#c7d2fe;margin-right:8px"></span><button id="outBtn">Sign out</button></div></div>
      <div class="tabs" id="tabs"></div>
    </div>
  </header>
  <main class="wrap" id="main"></main>
</div>

<dialog id="dlg"><div class="dh"><h2 id="dlgT"></h2><button onclick="closeDlg()" aria-label="Close">&times;</button></div><div class="db" id="dlgB"></div></dialog>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const naira = n => n == null ? '—' : '₦' + Number(n).toLocaleString('en-NG', { maximumFractionDigits: 2 });
const when = d => d ? new Date(d).toLocaleString('en-NG', { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' }) : '—';
const day = d => d ? new Date(d).toLocaleDateString('en-NG', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
const waNum = n => { let d = String(n || '').replace(/\D/g, ''); if (d.startsWith('0')) d = '234' + d.slice(1); return d; };
const must = r => { if (r.error) throw new Error(r.error.message); return r.data; };
const phoneRe = /^[0-9+ ()-]{7,20}$/;
const cfg = window.APP_CONFIG || {};
const sb = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

const STATUSES = ['Pending','Reviewed','Awaiting Payment','Paid','Assigned','Processing','Ready for Delivery','Delivered','Completed','Cancelled','Disputed'];
const statusCls = s => ({ Completed:'g', Delivered:'g', Paid:'g', Cancelled:'r', Disputed:'r', Pending:'y', 'Awaiting Payment':'y' })[s] || '';

let toastT;
function toast(m, bad) { const t = $('toast'); t.textContent = m; t.className = bad ? 'bad' : ''; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', 4000); }
async function run(fn, btn) {
  if (btn) btn.disabled = true;
  try { return await fn(); } catch (e) { toast(e.message || String(e), true); }
  finally { if (btn) btn.disabled = false; }
}
function openDlg(title, html) { $('dlgT').textContent = title; $('dlgB').innerHTML = html; if (!$('dlg').open) $('dlg').showModal(); }
function closeDlg() { $('dlg').close(); }
const inp = (id, label, val = '', type = 'text', extra = '') => `<div class="f"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(val)}" ${extra}></div>`;
const ta = (id, label, val = '', extra = '') => `<div class="f"><label for="${id}">${label}</label><textarea id="${id}" ${extra}>${esc(val)}</textarea></div>`;
const sel = (id, label, opts, val) => `<div class="f"><label for="${id}">${label}</label><select id="${id}">${opts.map(o => { const [v, t] = Array.isArray(o) ? o : [o, o]; return `<option value="${esc(v)}" ${String(v) === String(val ?? '') ? 'selected' : ''}>${esc(t)}</option>`; }).join('')}</select></div>`;
const mediaUrl = p => sb.storage.from('site-media').getPublicUrl(p).data.publicUrl;
const ext = { 'image/jpeg': 'jpg', 'image/png': 'png', 'image/webp': 'webp', 'image/svg+xml': 'svg' };
async function uploadMedia(file, folder) {
  if (!file) return null;
  if (!ext[file.type]) throw new Error('Use a JPG, PNG, WEBP or SVG image.');
  if (file.size > 2 * 1024 * 1024) throw new Error('Image must be under 2MB.');
  const path = `${folder}/${crypto.randomUUID()}.${ext[file.type]}`;
  must(await sb.storage.from('site-media').upload(path, file, { contentType: file.type }));
  return path;
}

// ---------------- AUTH ----------------
function showLogin(m) { $('app').hidden = true; $('login').hidden = false; $('loginMsg').textContent = m || ''; }
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault(); $('lBtn').disabled = true; $('loginMsg').textContent = '';
  const { data, error } = await sb.auth.signInWithPassword({ email: $('lEmail').value.trim(), password: $('lPass').value });
  $('lBtn').disabled = false;
  if (error) return $('loginMsg').textContent = error.message;
  await enter(data.user);
});
$('outBtn').onclick = async () => { await sb.auth.signOut(); showLogin(); };
sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT') showLogin(); });

async function enter(user) {
  const { data: p } = await sb.from('profiles').select('role,is_active,full_name,email').eq('id', user.id).maybeSingle();
  if (!p || p.role !== 'admin' || !p.is_active) { await sb.auth.signOut(); return showLogin('This account is not an active administrator.'); }
  $('login').hidden = true; $('app').hidden = false;
  $('who').textContent = p.full_name || p.email || '';
  go('dashboard');
}
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) enter(session.user); else showLogin();
})();

// ---------------- NAV ----------------
const TABS = [['dashboard','Dashboard'],['orders','Orders'],['delivery','Delivery Team'],['finance','Commissions'],['reviews','Reviews'],['complaints','Complaints'],['content','Site Content'],['pricing','Pricing'],['activity','Activity Log']];
$('tabs').innerHTML = TABS.map(([k, t]) => `<button data-k="${k}">${t}</button>`).join('');
$('tabs').onclick = e => { const b = e.target.closest('button'); if (b) go(b.dataset.k); };
const loaders = {};
function go(k, arg) {
  [...$('tabs').children].forEach(b => b.classList.toggle('on', b.dataset.k === k));
  $('main').innerHTML = '<p class="empty">Loading…</p>';
  run(() => loaders[k](arg));
}

// ---------------- DASHBOARD ----------------
loaders.dashboard = async () => {
  const [os, rv, cp, cm] = await Promise.all([
    sb.from('orders').select('status').limit(5000),
    sb.from('reviews').select('id', { count: 'exact', head: true }).eq('status', 'Pending'),
    sb.from('complaints').select('id', { count: 'exact', head: true }).in('status', ['Open', 'Investigating']),
    sb.from('commission_transactions').select('outstanding_balance')
  ]);
  const c = {}; must(os).forEach(o => c[o.status] = (c[o.status] || 0) + 1);
  const sum = (...k) => k.reduce((a, s) => a + (c[s] || 0), 0);
  const out = must(cm).reduce((a, r) => a + Number(r.outstanding_balance || 0), 0);
  const card = (n, l, on) => `<div class="stat" onclick="${on}"><b>${n}</b><span>${l}</span></div>`;
  $('main').innerHTML = `<h2>Dashboard</h2><div class="grid">
    ${card(c.Pending || 0, 'New requests', "goOrders('Pending')")}
    ${card(c['Awaiting Payment'] || 0, 'Awaiting payment', "goOrders('Awaiting Payment')")}
    ${card(sum('Paid','Assigned','Processing','Ready for Delivery'), 'In progress', "goOrders('')")}
    ${card(c.Delivered || 0, 'Delivered, not closed', "goOrders('Delivered')")}
    ${card(c.Completed || 0, 'Completed', "goOrders('Completed')")}
    ${card(sum('Cancelled','Disputed'), 'Cancelled / disputed', "goOrders('')")}
    ${card(rv.count || 0, 'Reviews to moderate', "go('reviews')")}
    ${card(cp.count || 0, 'Open complaints', "go('complaints')")}
    ${card(naira(out), 'Commission outstanding', "go('finance')")}
  </div>`;
};
let presetStatus = '';
function goOrders(s) { presetStatus = s; go('orders'); }

// ---------------- ORDERS ----------------
loaders.orders = async () => {
  $('main').innerHTML = `<h2>Orders</h2>
    <div class="bar"><input id="oQ" placeholder="Search reference, name or phone">
    <select id="oS"><option value="">All statuses</option>${STATUSES.map(s => `<option ${s === presetStatus ? 'selected' : ''}>${s}</option>`).join('')}</select>
    <button class="btn sec" id="oGo">Search</button></div><div class="card tw" id="oList"></div>`;
  presetStatus = '';
  $('oGo').onclick = () => run(listOrders);
  $('oQ').onkeydown = e => { if (e.key === 'Enter') run(listOrders); };
  $('oS').onchange = () => run(listOrders);
  await listOrders();
};
async function listOrders() {
  let q = sb.from('orders').select('id,order_reference,customer_name,phone_number,service_category,status,quote_status,total_amount,created_at,assigned_delivery_person').order('created_at', { ascending: false }).limit(200);
  const st = $('oS').value, s = $('oQ').value.trim().replace(/[,()%*]/g, '');
  if (st) q = q.eq('status', st);
  if (s) q = q.or(`order_reference.ilike.%${s}%,customer_name.ilike.%${s}%,phone_number.ilike.%${s}%`);
  const rows = must(await q);
  $('oList').innerHTML = rows.length ? `<table><thead><tr><th>Reference</th><th>Student</th><th>Service</th><th>Status</th><th>Total</th><th>Placed</th></tr></thead><tbody>` +
    rows.map(o => `<tr class="click" onclick="openOrder('${o.id}')"><td><b>${esc(o.order_reference)}</b></td><td>${esc(o.customer_name)}<br><span class="muted">${esc(o.phone_number)}</span></td><td>${esc(o.service_category)}</td>
    <td><span class="pill ${statusCls(o.status)}">${esc(o.status)}</span>${o.quote_status !== 'None' ? `<br><span class="muted">Quote: ${esc(o.quote_status)}</span>` : ''}</td><td>${naira(o.total_amount)}</td><td>${when(o.created_at)}</td></tr>`).join('') + '</tbody></table>'
    : '<p class="empty">No orders found.</p>';
}

async function openOrder(id) {
  await run(async () => {
    const [o, h, p, dps] = await Promise.all([
      sb.from('orders').select('*').eq('id', id).single(),
      sb.from('order_status_history').select('*').eq('order_id', id).order('created_at'),
      sb.from('payments').select('*').eq('order_id', id).order('created_at', { ascending: false }),
      sb.from('delivery_personnel').select('id,full_name,availability_status').eq('is_active', true).order('full_name')
    ]);
    const ord = must(o), hist = must(h), pays = must(p), team = must(dps);
    const pay = pays[0] || null;
    const files = [...(ord.attachment_path || []), ...(ord.reference_image_path ? [ord.reference_image_path] : [])];
    let links = [];
    if (files.length) {
      const r = await sb.storage.from('order-uploads').createSignedUrls(files, 3600);
      links = (r.data || []).map(x => x.signedUrl ? `<a href="${esc(x.signedUrl)}" target="_blank" rel="noopener">${esc(x.path.split('/')[1] || 'file')}</a>` : '').filter(Boolean);
    }
    const locked = !!ord.customer_approved_at || ['Cancelled', 'Completed'].includes(ord.status);
    const kv = (k, v) => `<div class="kv"><span>${k}</span><span>${v}</span></div>`;
    const dpName = (team.find(d => d.id === ord.assigned_delivery_person) || {}).full_name;

    openDlg(ord.order_reference, `
      <div style="margin-bottom:8px"><span class="pill ${statusCls(ord.status)}">${esc(ord.status)}</span> <span class="muted">Placed ${when(ord.created_at)}</span></div>
      ${kv('Student', esc(ord.customer_name))}
      ${kv('Phone', `<a href="tel:${esc(ord.phone_number)}">${esc(ord.phone_number)}</a>`)}
      ${kv('WhatsApp', `<a target="_blank" rel="noopener" href="https://wa.me/${waNum(ord.whatsapp_number)}?text=${encodeURIComponent('Hello, this is about your order ' + ord.order_reference)}">${esc(ord.whatsapp_number)}</a>`)}
      ${kv('Department / Level', esc([ord.department, ord.level].filter(Boolean).join(' / ') || '—'))}
      ${kv('Service', esc(ord.service_category))}
      ${kv('Quantity', ord.quantity)}
      ${kv('Fulfilment', esc(ord.fulfilment_method))}
      ${kv('Faculty / Building', esc(ord.faculty_or_building))}
      ${kv('Landmark', esc(ord.landmark || '—'))}
      ${kv('Collection point', esc(ord.collection_point || '—'))}
      ${kv('Delivery location', esc(ord.delivery_location))}
      <h3>Request</h3><p style="white-space:pre-wrap">${esc(ord.request_description)}</p>
      <h3>Uploaded files</h3><div>${links.length ? links.join(' &middot; ') : '<span class="muted">None</span>'}</div>

      <h3>Quotation</h3>
      ${kv('Quote status', esc(ord.quote_status) + (ord.customer_approved_at ? ' (approved ' + when(ord.customer_approved_at) + ')' : ''))}
      ${ord.confirmed_product_cost != null ? kv('Product cost', naira(ord.confirmed_product_cost)) + kv('Service fee', naira(ord.service_fee)) + kv('Delivery cost', naira(ord.delivery_cost)) + kv('Total', naira(ord.total_amount)) + kv('Admin share / Delivery share', naira(ord.admin_earning) + ' / ' + naira(ord.delivery_earning)) : ''}
      ${locked ? '<p class="muted" style="margin-top:6px">Quote is locked.</p>' : `
        <div class="two" style="margin-top:8px">${inp('qCost', 'Confirmed product cost (₦)', ord.confirmed_product_cost ?? '', 'number', 'min="0" step="0.01"')}${inp('qDel', 'Delivery cost (₦)', ord.delivery_cost ?? 0, 'number', 'min="0" step="0.01"')}</div>
        <button class="btn" id="qBtn">Confirm and send quote</button>`}

      <h3>Delivery person</h3>
      <p class="muted" style="margin-bottom:6px">Current: ${esc(dpName || 'Not assigned')}</p>
      <div class="two">${sel('aDp', '', [['', 'Select…'], ...team.map(d => [d.id, d.full_name + ' (' + d.availability_status + ')'])], ord.assigned_delivery_person)}<div><button class="btn sec" id="aBtn">Assign</button></div></div>

      <h3>Status and notes</h3>
      ${sel('sStatus', 'Status', STATUSES, ord.status)}
      ${inp('sReason', 'Cancellation reason (if cancelling)', ord.cancelled_reason || '')}
      ${ta('sNotes', 'Admin notes (private)', ord.admin_notes || '')}
      <button class="btn" id="sBtn">Save status and notes</button>

      <h3>Payment</h3>
      ${ord.total_amount == null ? '<p class="muted">Confirm a quote first to record payment.</p>' : `
        <p class="muted" style="margin-bottom:6px">Expected: ${naira(ord.total_amount)}</p>
        ${sel('pStatus', 'Payment status', ['Awaiting Payment', 'Paid', 'Partially Paid', 'Refunded', 'Disputed'], pay ? pay.payment_status : 'Awaiting Payment')}
        <div class="two">${inp('pRecv', 'Amount received (₦)', pay ? pay.amount_received : 0, 'number', 'min="0" step="0.01"')}${inp('pRefund', 'Refund amount (₦)', pay ? pay.refund_amount : 0, 'number', 'min="0" step="0.01"')}</div>
        <div class="two">${inp('pRef', 'Payment reference', pay?.payment_reference || '')}${inp('pDate', 'Payment date', pay?.payment_date || '', 'date')}</div>
        ${ta('pNotes', 'Payment notes', pay?.notes || '')}
        ${pay && pay.confirmed_at ? `<p class="muted" style="margin-bottom:6px">Confirmed ${when(pay.confirmed_at)}</p>` : ''}
        <button class="btn" id="pBtn">Save payment</button>`}

      <h3>Timeline</h3>
      <ul class="tl">${hist.map(x => `<li><b>${esc(x.to_status)}</b><small>${when(x.created_at)}${x.note ? ' · ' + esc(x.note) : ''}</small></li>`).join('') || '<li class="muted">No history.</li>'}</ul>
    `);

    const reopen = () => openOrder(id);
    if ($('qBtn')) $('qBtn').onclick = e => run(async () => {
      const cost = parseFloat($('qCost').value), del = parseFloat($('qDel').value || '0');
      if (!(cost >= 0)) throw new Error('Enter the confirmed product cost.');
      if (!(del >= 0)) throw new Error('Delivery cost cannot be negative.');
      must(await sb.rpc('confirm_order_quote', { p_order_id: id, p_product_cost: cost, p_delivery_cost: del }));
      toast('Quote sent to the student.'); reopen();
    }, e.target);
    $('aBtn').onclick = e => run(async () => {
      if (!$('aDp').value) throw new Error('Choose a delivery person.');
      must(await sb.rpc('assign_delivery_person', { p_order_id: id, p_dp_id: $('aDp').value }));
      toast('Delivery person assigned.'); reopen();
    }, e.target);
    $('sBtn').onclick = e => run(async () => {
      const st = $('sStatus').value;
      if (st === 'Cancelled' && !$('sReason').value.trim() && !confirm('Cancel without a reason?')) return;
      const rows = must(await sb.from('orders').update({ status: st, admin_notes: $('sNotes').value.trim() || null, cancelled_reason: $('sReason').value.trim() || null }).eq('id', id).select('id'));
      if (!rows.length) throw new Error('Not saved.');
      toast('Saved.'); reopen();
    }, e.target);
    if ($('pBtn')) $('pBtn').onclick = e => run(async () => {
      const st = $('pStatus').value;
      let recv = parseFloat($('pRecv').value || '0');
      if (st === 'Paid' && recv === 0) recv = Number(ord.total_amount);
      if (st === 'Paid' && recv < Number(ord.total_amount) && !confirm('Amount received is less than the total. Mark as Paid anyway?')) return;
      const row = { amount_received: recv, payment_status: st, payment_reference: $('pRef').value.trim() || null, payment_date: $('pDate').value || null, refund_amount: parseFloat($('pRefund').value || '0'), notes: $('pNotes').value.trim() || null };
      if (pay) must(await sb.from('payments').update(row).eq('id', pay.id).select('id'));
      else must(await sb.from('payments').insert({ ...row, order_id: id, amount_expected: ord.total_amount }).select('id'));
      if (st === 'Paid' && ['Pending', 'Reviewed', 'Awaiting Payment'].includes(ord.status))
        must(await sb.from('orders').update({ status: 'Paid' }).eq('id', id).select('id'));
      toast('Payment saved.'); reopen();
    }, e.target);
  });
}

function editDP(id) {

    ${inp('dName', 'Full name', p.full_name || '', 'text', 'maxlength="100"')}
    <div class="two">${inp('dPhone', 'Phone number', p.phone_number || '', 'tel')}${inp('dWa', 'WhatsApp number', p.whatsapp_number || '', 'tel')}</div>

// ---------------- COMMISSIONS ----------------
let COMM = [];
loaders.finance = async () => {
  COMM = must(await sb.from('commission_transactions').select('*, orders(order_reference,customer_name), delivery_personnel(full_name)').order('created_at', { ascending: false }).limit(300));
  const t = COMM.reduce((a, r) => ({ fee: a.fee + Number(r.service_fee), adm: a.adm + Number(r.admin_amount), rem: a.rem + Number(r.amount_remitted), out: a.out + Number(r.outstanding_balance) }), { fee: 0, adm: 0, rem: 0, out: 0 });
  $('main').innerHTML = `<h2>Commissions</h2>
    <div class="grid" style="margin-bottom:14px">
      <div class="stat"><b>${naira(t.fee)}</b><span>Service fees</span></div><div class="stat"><b>${naira(t.adm)}</b><span>Owed to administrator</span></div>
      <div class="stat"><b>${naira(t.rem)}</b><span>Remitted</span></div><div class="stat"><b>${naira(t.out)}</b><span>Outstanding</span></div></div>
    <div class="card tw">${COMM.length ? `<table><thead><tr><th>Order</th><th>Delivery person</th><th>Fee</th><th>Admin share</th><th>Remitted</th><th>Outstanding</th><th>Status</th><th></th></tr></thead><tbody>` +
    COMM.map(r => `<tr><td>${esc(r.orders?.order_reference || '—')}</td><td>${esc(r.delivery_personnel?.full_name || '—')}</td><td>${naira(r.service_fee)}</td><td>${naira(r.admin_amount)}</td><td>${naira(r.amount_remitted)}</td><td>${naira(r.outstanding_balance)}</td>
    <td><span class="pill ${r.remittance_status === 'Remitted' ? 'g' : r.remittance_status === 'Outstanding' ? 'y' : ''}">${esc(r.remittance_status)}</span></td>
    <td>${r.remittance_status === 'Remitted' ? '' : `<button class="btn sm" onclick="remit('${r.id}')">Record</button>`}</td></tr>`).join('') + '</tbody></table>' : '<p class="empty">Records appear here when orders are marked Completed.</p>'}</div>`;
};
function remit(id) {
  const r = COMM.find(x => x.id === id);
  openDlg('Record remittance', `<p class="muted" style="margin-bottom:8px">${esc(r.orders?.order_reference || '')} · Outstanding ${naira(r.outstanding_balance)}</p>
    ${inp('rAmt', 'Amount received now (₦)', r.outstanding_balance, 'number', 'min="0" step="0.01"')}${inp('rRef', 'Reference', r.remittance_reference || '')}
    <button class="btn" id="rSave">Save</button>`);
  $('rSave').onclick = e => run(async () => {
    const add = parseFloat($('rAmt').value);
    if (!(add > 0)) throw new Error('Enter an amount above zero.');
    const total = Number(r.amount_remitted) + add;
    if (total > Number(r.admin_amount)) throw new Error('That is more than the amount owed.');
    must(await sb.from('commission_transactions').update({ amount_remitted: total, remittance_reference: $('rRef').value.trim() || null }).eq('id', id).select('id'));
    closeDlg(); toast('Remittance recorded.'); go('finance');
  }, e.target);
}

loaders.content = async () => {

    <div class="tw"><table><thead><tr><th></th><th>Name</th><th>Order</th><th>Status</th><th></th></tr></thead><tbody>${SVC.map(v => `<tr><td>${v.image_path ? `<img class="thumb" style="height:40px;width:40px" src="${esc(mediaUrl(v.image_path))}" alt="">` : esc(v.icon || '')}</td><td>${esc(v.name)}<br><span class="muted">${esc(v.description || '')}</span></td><td>${v.sort_order}</td><td>${v.is_active ? '<span class="pill g">Active</span>' : '<span class="pill m">Hidden</span>'}</td><td><button class="btn sm sec" onclick="editSvc('${v.id}')">Edit</button></td></tr>`).join('')}</tbody></table></div></div>

  <div class="card"><h3 style="margin-top:0">Completed orders gallery</h3>
    ${inp('g_title', 'Title', '', 'text', 'maxlength="120"')}${ta('g_desc', 'Description (optional)')}

// ---------------- PRICING ----------------
loaders.pricing = async () => {
  const rows = must(await sb.from('commission_settings').select('*').order('created_at', { ascending: false }).limit(20));
  const a = rows.find(r => r.is_active) || {};
  $('main').innerHTML = `<h2>Pricing Settings</h2>
  <div class="card"><p class="muted" style="margin-bottom:10px">Service fee = product cost × percentage, never below the minimum fee. Changes apply to future quotes only. Past quotes keep their own frozen values.</p>
    <div class="two">${inp('cPct', 'Commission (%)', a.commission_percent ?? 20, 'number', 'min="0" max="100" step="0.01"')}${inp('cMin', 'Minimum fee (₦)', a.minimum_fee ?? 100, 'number', 'min="0" step="0.01"')}</div>
    <div class="two">${inp('cAdm', 'Administrator share (%)', a.admin_share_percent ?? '', 'number', 'min="0" max="100" step="0.01"')}${inp('cDel', 'Delivery person share (%)', a.delivery_share_percent ?? '', 'number', 'min="0" max="100" step="0.01"')}</div>
    ${a.admin_share_percent == null ? '<p class="muted" style="color:var(--red);margin-bottom:8px">Shares are not set. Quotes cannot be confirmed until you save them.</p>' : ''}
    <button class="btn" id="cSaveP">Save settings</button></div>
  <div class="card tw"><h3 style="margin-top:0">History</h3><table><thead><tr><th>Date</th><th>Commission</th><th>Min fee</th><th>Admin / Delivery</th><th></th></tr></thead><tbody>${rows.map(r => `<tr><td>${when(r.created_at)}</td><td>${r.commission_percent}%</td><td>${naira(r.minimum_fee)}</td><td>${r.admin_share_percent ?? '—'} / ${r.delivery_share_percent ?? '—'}</td><td>${r.is_active ? '<span class="pill g">Active</span>' : ''}</td></tr>`).join('')}</tbody></table></div>`;
  $('cAdm').oninput = () => { const v = parseFloat($('cAdm').value); if (v >= 0 && v <= 100) $('cDel').value = +(100 - v).toFixed(2); };
  $('cDel').oninput = () => { const v = parseFloat($('cDel').value); if (v >= 0 && v <= 100) $('cAdm').value = +(100 - v).toFixed(2); };
  $('cSaveP').onclick = e => run(async () => {
    const p = parseFloat($('cPct').value), m = parseFloat($('cMin').value), ad = parseFloat($('cAdm').value), dl = parseFloat($('cDel').value);
    if ([p, m, ad, dl].some(isNaN)) throw new Error('Fill in all four fields.');
    if (Math.abs(ad + dl - 100) > 0.001) throw new Error('Shares must add up to 100.');
    must(await sb.rpc('save_commission_settings', { p_percent: p, p_min_fee: m, p_admin_share: ad, p_delivery_share: dl }));
    toast('Pricing saved.'); go('pricing');
  }, $('cSaveP'));
};
